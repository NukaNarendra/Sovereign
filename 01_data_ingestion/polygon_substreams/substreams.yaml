STREAMING_CHUNK:Defining map_ctf_exchange_fills and map_conditional_token_lifecycle...

modules:

----------------------------------------------------------------------------

1. MAP MODULE: Extracts all CLOB v1, CLOB v2 (pUSD), & NegRisk OrderFilled logs

Event Topic0: 0xd0a08e8c493f9c94f29311604c9de1b4e8c8d4c06bd0c789af57f2d65bfec0f6

----------------------------------------------------------------------------

name: map_ctf_exchange_fills
kind: map
initialBlock: 33605400
inputs:

params: string

source: sf.ethereum.type.v2.Block
output:
type: proto:sovereign.polymarket.v2.BlockOrderFillsBatch
doc: |
Decodes every OrderFilled and OrdersMatched log emitted on Polygon by
CTF Exchange v1 (0x4bFb41d5...) and CLOB v2 / NegRisk Exchange (0xC5d563A3...).
Computes canonical 6-decimal USD notional and implied probability p_t.

----------------------------------------------------------------------------

2. MAP MODULE: Extracts CTF ConditionPreparation, PositionSplit, Merge & Redeem

----------------------------------------------------------------------------

name: map_conditional_token_lifecycle
kind: map
initialBlock: 4023686
inputs:

params: string

source: sf.ethereum.type.v2.Block
output:
type: proto:sovereign.polymarket.v2.BlockCtfLifecycleBatch
doc: |
Tracks ERC-1155 conditional token minting (PositionSplit), burning
(PositionsMerge), and final settlement redemptions (PayoutRedemption)
against both legacy USDC.e and native USDC / pUSD collateral wrappers.

STREAMING_CHUNK:Defining map_uma_oracle_resolutions and whale store modules...

----------------------------------------------------------------------------

3. MAP MODULE: Extracts UMA Optimistic Oracle QuestionInitialized & Disputes

----------------------------------------------------------------------------

name: map_uma_oracle_resolutions
kind: map
initialBlock: 33605400
inputs:

params: string

source: sf.ethereum.type.v2.Block
output:
type: proto:sovereign.polymarket.v2.BlockUmaOracleEventsBatch
doc: |
Captures QuestionInitialized, QuestionResolved, ProposePrice, and
DisputePrice events from UmaCtfAdapter and OptimisticOracleV3, preserving
raw hexadecimal ancillaryData for Stage 2 Part C rule decoding.

----------------------------------------------------------------------------

4. STORE MODULE: Cumulative Volume & Realized PnL Ledger per Polygon Wallet

----------------------------------------------------------------------------

name: store_wallet_cumulative_stats
kind: store
initialBlock: 33605400
updatePolicy: add
valueType: int64
inputs:

map: map_ctf_exchange_fills

map: map_conditional_token_lifecycle
doc: |
Maintains running on-chain volume, maker/taker ratio, and redemption
payouts per Polygon address to identify sharp institutional ("whale")
wallets in real time.

----------------------------------------------------------------------------

5. MAP MODULE: Sharp Whale Flow Divergence Signal Generator

----------------------------------------------------------------------------

name: map_sharp_whale_flow_signals
kind: map
initialBlock: 33605400
inputs:

map: map_ctf_exchange_fills

store: store_wallet_cumulative_stats
mode: get
output:
type: proto:sovereign.polymarket.v2.BlockWhaleSignalBatch
doc: |
Emits a high-priority signal whenever a wallet with >$50,000 historical
realized profit and >62% Brier calibration accuracy sweeps a CLOB v2 book.

